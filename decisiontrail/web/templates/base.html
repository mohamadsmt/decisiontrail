<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DecisionTrail{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="header-identity">
      <a class="brand" href="/">DecisionTrail</a>
      <span class="header-context">Local decision log</span>
    </div>
    <nav class="primary-nav" aria-label="Primary">
      <a href="/">Dashboard</a>
      <a href="/review">Review</a>
      <a href="/graph">Graph</a>
      <a href="/drafts">Drafts</a>
      <details class="nav-more">
        <summary>More</summary>
        <div class="nav-more-menu">
          <a href="/audit">Audit</a>
          <a href="/meeting-parser">Meeting parser</a>
        </div>
      </details>
      <a class="button button-small" href="/decisions/new">New decision</a>
    </nav>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
