[project]
name = "decisiontrail"
version = "0.4.0"
description = "Git-native decision log for founders, product teams, and operators."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "DecisionTrail contributors" }
]
keywords = ["decision-log", "adr", "product", "strategy", "local-first", "cli"]
dependencies = [
  "fastapi>=0.115",
  "jinja2>=3.1",
  "markdown>=3.6",
  "mcp>=1.12.4",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
  "uvicorn>=0.32",
]

[project.scripts]
decisiontrail = "decisiontrail.cli:app"
decisiontrail-mcp = "decisiontrail.mcp_server:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
